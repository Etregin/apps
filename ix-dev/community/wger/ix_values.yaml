  run_as_user: 1000
  run_as_group: 1000
  internal_server_port: 8000

  notes_body: |
    In order to sync exercises, you need to shell into the `server` container
    and run the following commands (This process can take a while):

    ```sh
    python3 manage.py sync-exercises
    python3 manage.py download-exercise-images
    python3 manage.py download-exercise-videos
    ```

    ## PowerSync (mobile app sync)

    Run the following one-time setup commands after the first start to create
    the required Postgres role, schema, and replication slot:

    ```sh
    python3 manage.py setup-powersync-storage
    ```

    This command is idempotent and safe to re-run if needed.

    ### Customising sync rules

    The `sync_rules.yaml` file controls which data is replicated to the mobile app.
    It is stored in the **PowerSync Sync Rules** storage volume and can be edited freely —
    the app will never overwrite it.
    
    On first start, the `powersync-init` helper seeds a default `sync_rules.yaml` into that volume.
    To inspect or edit it, open a shell in the `powersync-init` container before it exits, or read it
    directly from the volume mount:
    
    ```sh
    cat /sync_rules/sync_rules.yaml
    ```
